name: App-shell pilot

on:
  pull_request:
    paths:
      - '.github/workflows/app-shell-pilot.yml'
      - 'prototypes/app-shell/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/app-shell-pilot.yml'
      - 'prototypes/app-shell/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/app-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/app-shell/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          npm run preview > /tmp/app-shell-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4310/ && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4310/
          npm test
